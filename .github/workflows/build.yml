name: Build RhythmMP4GPU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons
        run: python -m pip install scons

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and build tools
        run: |
          sdkmanager --install \
            "ndk;27.2.12479018" \
            "cmake;3.22.1" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build Godot C++ Debug
        run: |
          scons -C godot-cpp platform=android target=template_debug arch=arm64 -j2

      - name: Build Godot C++ Release
        run: |
          scons -C godot-cpp platform=android target=template_release arch=arm64 -j2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Plugin
        run: |
          chmod +x ./gradlew
          ./gradlew assemble --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RhythmMP4GPU-Build
          path: |
            plugin/build/outputs/aar/*.aar
            plugin/demo/addons/RhythmMP4GPU/
          if-no-files-found: error
